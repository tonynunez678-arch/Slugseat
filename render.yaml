services:
  - type: web
    name: slugseat
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SLUGSEAT_DATABASE_URL
        sync: false
      - key: SLUGSEAT_BREVO_API_KEY
        sync: false
      - key: SLUGSEAT_EMAIL_FROM
        sync: false
      - key: SLUGSEAT_RUN_POLLER
        value: "true"
      - key: SLUGSEAT_NOTIFIER
        value: email
